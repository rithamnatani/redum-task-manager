<mat-card class="task-card">
  <mat-card-header>
    <mat-card-title>{{ task.title }}</mat-card-title>
    <div class="card-actions">
      <button mat-icon-button (click)="onEdit()" aria-label="Edit task">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="onDelete()" aria-label="Delete task">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </mat-card-header>
  
  <mat-card-content>
    @if (task.description) {
      <p class="task-description">{{ task.description }}</p>
    }
    
    <div class="task-metadata">
      @if (task.priority) {
        <mat-chip [highlighted]="true" [color]="getPriorityColor()">
          {{ getPriorityLabel() }} Priority
        </mat-chip>
      }
      
      @if (task.due_date) {
        <div class="due-date">
          <mat-icon>event</mat-icon>
          <span>{{ task.due_date | date:'short' }}</span>
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>
